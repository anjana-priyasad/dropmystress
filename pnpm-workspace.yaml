# Older pnpm versions (used by some CI/hosting providers) require a packages list.
packages:
  - "."

# pnpm 11: which dependencies may run install scripts.
allowBuilds:
  '@google/genai': false
  protobufjs: false
  unrs-resolver: false
  # Needed by the Cloudflare adapter to download native binaries.
  esbuild: true
  workerd: true

# pnpm 10 equivalent of the allow-list above.
onlyBuiltDependencies:
  - esbuild
  - workerd
